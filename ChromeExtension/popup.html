<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      padding: 16px;
      font-family: system-ui, sans-serif;
      color: #0f172a;
    }
    button {
      width: 100%;
      padding: 10px;
      cursor: pointer;
      border: 0;
      border-radius: 6px;
      background: rgb(0, 101, 148);
      color: white;
      font-weight: 600;
    }
    button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }
    #title {
      margin: 16px 0 4px;
      font-weight: 600;
    }
    #host, #status {
      color: #64748b;
      font-size: 0.85em;
    }
    #dashboard {
      display: inline-block;
      margin-top: 12px;
      color: rgb(0, 101, 148);
      font-size: 0.85em;
    }
  </style>
</head>
<body>
  <strong>Resume Adapter</strong>
  <p id="title"></p>
  <div id="host"></div>
  <div id="status"></div>
  <button id="sendBtn" disabled>Make a Resume</button>
  <a id="dashboard" href="#">Open dashboard</a>
  <script src="popup.js"></script>
</body>
</html>
