<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      padding: 16px;
      font-family: system-ui, sans-serif;
      color: #0f172a;
    }
    button {
      width: 100%;
      padding: 10px;
      cursor: pointer;
      border: 0;
      border-radius: 6px;
      background: rgb(0, 101, 148);
      color: white;
      font-weight: 600;
    }
    button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }
    button.secondary {
      background: transparent;
      border: 1px solid rgb(0, 101, 148);
      color: rgb(0, 101, 148);
      margin-top: 8px;
    }
    select {
      width: 100%;
      padding: 8px;
      margin: 10px 0 8px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background: white;
      color: #0f172a;
    }
    #title {
      margin: 16px 0 4px;
      font-weight: 600;
    }
    #host, #status, #autofillStatus {
      color: #64748b;
      font-size: 0.85em;
    }
    #dashboard {
      display: inline-block;
      margin-top: 12px;
      color: rgb(0, 101, 148);
      font-size: 0.85em;
    }
    #autofillSection {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid #e2e8f0;
    }
  </style>
</head>
<body>
  <strong>Resume Adapter</strong>
  <p id="title"></p>
  <div id="host"></div>
  <div id="status"></div>
  <button id="sendBtn" disabled>Make a Resume</button>

  <div id="autofillSection" style="display: none;">
    <select id="jobSelect" disabled></select>
    <button id="fillBtn" class="secondary" disabled>Fill form</button>
    <button id="downloadBtn" class="secondary" disabled>Download resume</button>
    <div id="autofillStatus"></div>
  </div>

  <a id="dashboard" href="#">Open dashboard</a>
  <script type="module" src="popup.js"></script>
</body>
</html>
