# AWS Amplify Hosting build for the frontend (monorepo: app root = frontend/).
# Set VITE_API_URL, VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY, VITE_USE_MOCKS=false in the Amplify console.
# Add the SPA rewrite in the console: </^[^.]+$/>  ->  /index.html  (200).
version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
