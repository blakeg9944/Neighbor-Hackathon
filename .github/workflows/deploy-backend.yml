# Deploys the backend on pushes to `prod` (release with: git push origin main:prod).
# Needs repo secrets SERVER_IP and SSH_KEY.
name: Deploy backend
on:
  push:
    branches: [prod]
    paths: ["backend/**", "shared/**"]  # shared/resume_templates.json styles the PDFs
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd ~/Neighbor-Hackathon && git pull
            ~/venv/bin/pip install -r backend/requirements.txt
            sudo systemctl restart trimdcv-api
